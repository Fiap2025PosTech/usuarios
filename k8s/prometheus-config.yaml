apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: users
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'users-cluster'
        environment: 'production'

    scrape_configs:
      - job_name: 'usuarios-api'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - users
        relabel_configs:
          # Apenas pods com label app=users-api
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: users-api
          
          # Usar o IP do pod
          - source_labels: [__meta_kubernetes_pod_ip]
            action: replace
            target_label: __address__
            replacement: $1:8080
          
          # Adicionar labels úteis
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          
          - source_labels: [__meta_kubernetes_pod_node_name]
            action: replace
            target_label: node
        
        metrics_path: '/metrics'
        scrape_interval: 10s
        scrape_timeout: 5s
